<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">RescueRelay submission thumbnail</title>
  <desc id="description">The agent prepares, people decide. Live nonprofit data and five WebMCP tools support a human-approved food-rescue handoff.</desc>
  <rect width="1280" height="720" fill="#f8f5ed"/>
  <rect x="686" width="594" height="720" fill="#173655"/>

  <g transform="translate(0 45)">

  <g transform="translate(58 48)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect width="42" height="42" rx="12" fill="#12675f"/>
    <text x="21" y="28" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="850">R</text>
    <text x="56" y="28" fill="#0b2622" font-size="22" font-weight="780">RescueRelay</text>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="58" y="154" fill="#12675f" font-size="15" font-weight="800" letter-spacing="2.2">A WEBMCP FOOD-RESCUE DEMO</text>
    <text x="58" y="231" fill="#0b2622" font-size="67" font-weight="800" letter-spacing="-2.4">The agent prepares.</text>
    <text x="58" y="306" fill="#0b2622" font-size="67" font-weight="800" letter-spacing="-2.4">People decide.</text>
    <text x="58" y="362" fill="#566a65" font-size="22" font-weight="500">Live nonprofit records in. Explainable handoff out.</text>

    <g transform="translate(58 425)">
      <rect width="171" height="45" rx="12" fill="#e3f2ee"/>
      <circle cx="20" cy="22.5" r="5" fill="#12675f"/>
      <text x="35" y="29" fill="#0c4f49" font-size="16" font-weight="750">3 live records</text>
      <rect x="184" width="178" height="45" rx="12" fill="#e9eff5"/>
      <text x="204" y="29" fill="#173655" font-size="16" font-weight="750">5 WebMCP tools</text>
    </g>

    <g transform="translate(58 525)">
      <line x1="0" y1="0" x2="555" y2="0" stroke="#c6d1cc"/>
      <text x="0" y="36" fill="#657570" font-size="16" font-weight="650">Agents prepare</text>
      <text x="206" y="36" fill="#657570" font-size="16" font-weight="650">People send</text>
      <text x="404" y="36" fill="#657570" font-size="16" font-weight="650">People respond</text>
    </g>
  </g>

  <g transform="translate(735 58)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect width="416" height="514" rx="20" fill="#fffefd"/>
    <rect x="28" y="28" width="360" height="45" rx="12" fill="#f4fbf8" stroke="#b8d9cf"/>
    <circle cx="50" cy="50.5" r="5" fill="#1c8b74"/>
    <text x="66" y="56" fill="#0c4f49" font-size="14" font-weight="800">3 / 3 LIVE RECORDS SYNCED</text>

    <text x="28" y="115" fill="#12675f" font-size="13" font-weight="800" letter-spacing="1.7">PREPARED HANDOFF</text>
    <text x="28" y="169" fill="#0b2622" font-size="45" font-weight="820" letter-spacing="-1.8">36 meals</text>
    <text x="28" y="198" fill="#5f706c" font-size="16" font-weight="650">Sealed · chilled · vegetarian</text>

    <g transform="translate(28 240)">
      <line x1="35" y1="20" x2="325" y2="20" stroke="#c6d1cc" stroke-width="2"/>
      <circle cx="35" cy="20" r="18" fill="#173655"/>
      <circle cx="180" cy="20" r="18" fill="#12675f"/>
      <circle cx="325" cy="20" r="18" fill="#fffefd" stroke="#12675f" stroke-width="3"/>
      <text x="35" y="25" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="800">D</text>
      <text x="180" y="25" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="800">A</text>
      <text x="325" y="25" text-anchor="middle" fill="#12675f" font-size="14" font-weight="800">R</text>
      <text x="35" y="59" text-anchor="middle" fill="#566071" font-size="13" font-weight="700">Donor</text>
      <text x="180" y="59" text-anchor="middle" fill="#566071" font-size="13" font-weight="700">Agent</text>
      <text x="325" y="59" text-anchor="middle" fill="#566071" font-size="13" font-weight="700">Recipient</text>
    </g>

    <g transform="translate(28 337)">
      <rect width="360" height="68" rx="13" fill="#f5faf7" stroke="#dce3df"/>
      <circle cx="27" cy="34" r="12" fill="#12675f"/>
      <path d="M21.5 34.2 25 37.5 32.5 29.8" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="50" y="29" fill="#0b2622" font-size="14" font-weight="780">Eligible recipient found</text>
      <text x="50" y="49" fill="#5f706c" font-size="12.5" font-weight="550">Rules and exclusions are explained</text>
    </g>

    <g transform="translate(28 429)">
      <rect width="360" height="57" rx="12" fill="#dd6a56"/>
      <text x="180" y="35" text-anchor="middle" fill="#31120c" font-size="16" font-weight="820">Human review required</text>
    </g>
  </g>
  </g>
</svg>
